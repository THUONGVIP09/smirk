# Occlusion-aware transfer learning of the pretrained SMIRK (train_occlusion.py).
# Starts from SMIRK_em1.pt; the expression backbone and the translator stay frozen, only the expression regression head
# is trained (no cycle path).
resume: pretrained_models/SMIRK_em1.pt   # initial weights (also the base encoder: occlusion.teacher=base)
load_encoder: True
load_fuse_generator: True
resume_checkpoint:                        # checkpoint_last.pt of an interrupted run
device: cuda:0
seed: 0                                   # faces of every epoch, augmentations, masking (train_occlusion.py)
image_size: 224
K: 1

train:
  lr: 1e-3                  # the encoder uses 0.25 * lr (BaseTrainer.configure_optimizers); only the head trains
  num_epochs: 3
  batch_size: 16
  num_workers: 4
  samples_per_epoch: 20000
  log_path: logs/occlusion_transfer
  log_losses_every: 50
  visualize_every: 500
  save_every: 1
  save_every_iters: 500     # resumable checkpoint
  time_limit_hours: 11.0    # stop (with a checkpoint) before Kaggle's 12 h limit
  max_iters: 0              # > 0: stop after this many iterations (quick test)
  val_batches: 50
  mask_ratio: 0.01
  mask_dilation_radius: 10
  Ke: 1
  use_base_model_for_regularization: False  # as the original SMIRK: regularize towards zero (True: towards the pretrained SMIRK on the clean image)
  resume_epoch: 0
  train_scale_min: 1.2
  train_scale_max: 1.8
  test_scale: 1.6

  loss_weights:
    landmark_loss: 100.0
    perceptual_vgg_loss: 10.0
    reconstruction_loss: 10.0
    emotion_loss: 1.0           # set to 0 when the EMOCA emotion network (assets/ResNet50) is not available
    jaw_regularization: 1e-2
    expression_regularization: 1e-3
    shape_regularization: 100
    cycle_loss: 0.0             # no cycle path: the translator is frozen
    mica_loss: 0
    visible_consistency: 1.0    # expression mesh vs occlusion.teacher on the clean image, on the visible face vertices (mm)

  optimize_pose: False
  optimize_shape: False
  optimize_expression: True
  freeze_encoder_in_second_path: False
  freeze_generator_in_second_path: False

occlusion:
  p_occluded: 0.5                     # share of occluded inputs (the rest are clean faces)
  max_occluded_area: 0.7              # skip nearly fully occluded faces
  landmark_weight_occluded: 0.2       # weight of occluded landmarks (visible = 1)
  reconstruction_weight_occluded: 0.2 # weight of occluded pixels in the L1 reconstruction loss (visible = 1)
  consistency_weight_occluded: 0.1    # weight of occluded vertices in the visible-region consistency (visible = 1)
  teacher: self                       # visible-region consistency target on the clean image: self (the trained encoder, no gradient) or base (the pretrained SMIRK)
  cycle_occlusion: False
  freeze_backbone: True               # transfer learning: train only the expression head
  optimize_generator: False
  freeze_bn_not_optimized: False      # True: batch-norm statistics of the not optimized pose / shape encoders stay fixed (the original SMIRK lets them change)

arch:
  backbone_pose: tf_mobilenetv3_small_minimal_100
  backbone_shape: tf_mobilenetv3_large_minimal_100
  backbone_expression: tf_mobilenetv3_large_minimal_100
  num_expression: 50
  num_shape: 300
  use_eyelids: True
  enable_fuse_generator: True

data:            # filled from --paths paths.yaml
  clean_dirs: []
  image_dirs: {}
  occluded_dirs: {}
  fan_files: {}    # {dataset: .npz from extract_fan_landmarks.py}, optional
  exclude_files: [] # exclude_train.csv of find_duplicates.py: train faces that duplicate evaluation faces
